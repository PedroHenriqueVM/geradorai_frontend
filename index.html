<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChefIA</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-[#ede3d3] text-[#4e3427] min-h-screen flex flex-col">

    <div>

        <!-- HEADER -->
        <header class="pt-10 pb-4">

            <div class="max-w-4xl mx-auto px-5">

                <div class="flex items-center gap-4">

                    <div class="text-5xl">
                        🍲
                    </div>

                    <div>

                        <h1 class="text-5xl font-black tracking-tight">
                            ChefIA
                        </h1>

                        <p class="text-[#7b5e4b] mt-1 italic">
                            receitas com alma de cozinha caseira
                        </p>

                    </div>

                </div>

            </div>

        </header>

        <!-- MAIN -->
        <main class="max-w-3xl mx-auto p-5">

            <!-- CARD -->
            <div
                class="bg-[#fffaf2] rounded-[30px] p-8 border-2 border-[#d8c2b0] shadow-[0_8px_30px_rgba(0,0,0,0.08)] relative overflow-hidden"
            >

                <!-- DECORAÇÃO -->
                <div
                    class="absolute top-0 right-0 w-40 h-40 bg-[#e7d8c9] rounded-full blur-3xl opacity-40"
                ></div>

                <div class="relative z-10">

                    <h2 class="text-3xl font-black mb-2">
                        Ingredientes
                    </h2>

                    <p class="text-[#7b5e4b] mb-6">
                        Escolha os ingredientes e descubra uma receita especial.
                    </p>

                    <!-- FORM -->
                    <form id="recipe-form" onsubmit="gerarReceita(event)">

                        <!-- INPUTS -->
                        <div id="inputs-container" class="space-y-3">

                            <input
                                type="text"
                                placeholder="Ingrediente 1"
                                required
                                class="ingrediente-input w-full bg-[#fffdf9] border-2 border-[#dbc8b8] p-4 rounded-2xl focus:outline-none focus:border-[#a2674c]"
                            >

                            <input
                                type="text"
                                placeholder="Ingrediente 2"
                                required
                                class="ingrediente-input w-full bg-[#fffdf9] border-2 border-[#dbc8b8] p-4 rounded-2xl focus:outline-none focus:border-[#a2674c]"
                            >

                            <input
                                type="text"
                                placeholder="Ingrediente 3"
                                required
                                class="ingrediente-input w-full bg-[#fffdf9] border-2 border-[#dbc8b8] p-4 rounded-2xl focus:outline-none focus:border-[#a2674c]"
                            >

                        </div>

                        <!-- BOTÃO ADD -->
                        <button
                            type="button"
                            onclick="adicionarInput()"
                            class="mt-4 text-[#8b5e46] font-bold hover:text-[#6f4531] transition"
                        >
                            + Adicionar ingrediente
                        </button>

                        <!-- BUTTONS -->
                        <div class="mt-6 flex gap-4">

                            <!-- GERAR -->
                            <button
                                type="submit"
                                id="btn-enviar"
                                class="flex-1 bg-[#a2674c] hover:bg-[#8d563d] text-white font-semibold py-4 px-4 rounded-2xl transition flex justify-center items-center gap-2"
                            >

                                <span>Gerar Receita</span>

                                <!-- LOADING -->
                                <div
                                    id="loading-spinner"
                                    class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
                                ></div>

                            </button>

                            <!-- REINICIAR -->
                            <button
                                type="button"
                                onclick="reiniciarFormulario()"
                                class="bg-[#eadccf] hover:bg-[#dbc8b8] text-[#4e3427] font-semibold py-4 px-6 rounded-2xl transition"
                            >
                                Reiniciar
                            </button>

                        </div>

                    </form>

                </div>

            </div>

            <!-- ERRO -->
            <div
                id="error-message"
                class="hidden mt-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-2xl text-sm"
            ></div>

            <!-- RESULTADO -->
            <div
                id="resultado-container"
                class="hidden mt-8 bg-[#fffaf2] p-8 rounded-[30px] border-2 border-[#d8c2b0] shadow-[0_8px_30px_rgba(0,0,0,0.08)] mb-12"
            >

                <!-- TITULO -->
                <h2
                    id="rec-titulo"
                    class="text-4xl font-black text-[#8b5e46] mb-4"
                ></h2>

                <!-- INFO -->
                <div class="flex gap-4 text-sm mb-6 flex-wrap">

                    <div
                        class="bg-[#efe1d1] px-5 py-4 rounded-2xl border border-[#dbc8b8]"
                    >
                        ⏱️ <strong>Tempo:</strong>
                        <span id="rec-tempo"></span>
                    </div>

                    <div
                        class="bg-[#dfe7d6] px-5 py-4 rounded-2xl border border-[#c7d1bb]"
                    >
                        🍽️ <strong>Rendimento:</strong>
                        <span id="rec-porcoes"></span>
                    </div>

                </div>

                <!-- AÇÕES -->
                <div class="flex flex-wrap gap-3 mb-8">

                    <button
                        onclick="salvarFavorita()"
                        class="bg-[#f3e7da] hover:bg-[#e7d8c9] px-4 py-3 rounded-2xl border border-[#dbc8b8] transition"
                    >
                        ❤️ Favoritar
                    </button>

                    <button
                        onclick="compartilharReceita()"
                        class="bg-[#f3e7da] hover:bg-[#e7d8c9] px-4 py-3 rounded-2xl border border-[#dbc8b8] transition"
                    >
                        📤 Compartilhar
                    </button>

                    <button
                        onclick="baixarPDF()"
                        class="bg-[#f3e7da] hover:bg-[#e7d8c9] px-4 py-3 rounded-2xl border border-[#dbc8b8] transition"
                    >
                        📄 Baixar PDF
                    </button>

                    <button
                        onclick="window.print()"
                        class="bg-[#f3e7da] hover:bg-[#e7d8c9] px-4 py-3 rounded-2xl border border-[#dbc8b8] transition"
                    >
                        🖨️ Imprimir
                    </button>

                </div>

                <!-- INGREDIENTES -->
                <div class="mb-6">

                    <h3 class="text-2xl font-bold mb-3">
                        📋 Ingredientes necessários
                    </h3>

                    <ul
                        id="rec-ingredientes"
                        class="space-y-3"
                    ></ul>

                </div>

                <!-- PREPARO -->
                <div>

                    <h3 class="text-2xl font-bold mb-3">
                        👨‍🍳 Modo de preparo
                    </h3>

                    <ol
                        id="rec-preparo"
                        class="list-decimal pl-5 space-y-3"
                    ></ol>

                </div>

            </div>

            <!-- FAVORITAS -->
            <div
                id="favoritas-container"
                class="hidden mb-12"
            >

                <h2 class="text-3xl font-black mb-4">
                    ❤️ Receitas Favoritas
                </h2>

                <div
                    id="lista-favoritas"
                    class="space-y-4"
                ></div>

            </div>

        </main>

    </div>

    <!-- FOOTER -->
    <footer class="mt-12 pb-8">

        <div class="text-center text-[#7b5e4b]">

            <p class="font-bold">
                ChefIA
            </p>

            <p class="text-sm mt-1 italic">
                feito para amantes da culinária caseira
            </p>

        </div>

    </footer>

    <!-- SCRIPT -->
    <script>

        // URL API
        const API_URL = "https://geradorai-backend-eight.vercel.app/generate";

        // ELEMENTOS
        const containerInputs = document.getElementById('inputs-container');
        const spinner = document.getElementById('loading-spinner');
        const btnEnviar = document.getElementById('btn-enviar');
        const resultadoContainer = document.getElementById('resultado-container');
        const errorContainer = document.getElementById('error-message');

        let receitaAtual = null;

        // ADICIONAR INPUT
        function adicionarInput() {

            const totalInputs =
                containerInputs.querySelectorAll('.ingrediente-input').length + 1;

            const wrapper = document.createElement('div');

            wrapper.className = 'flex gap-2 items-center';

            wrapper.innerHTML = `

                <input
                    type="text"
                    placeholder="Ingrediente ${totalInputs}"
                    class="ingrediente-input w-full bg-[#fffdf9] border-2 border-[#dbc8b8] p-4 rounded-2xl focus:outline-none focus:border-[#a2674c]"
                >

                <button
                    type="button"
                    class="bg-red-100 hover:bg-red-200 text-red-600 font-bold p-4 rounded-2xl transition"
                >
                    ✕
                </button>

            `;

            wrapper.querySelector('button').onclick = function() {

                wrapper.remove();

                reorganizarPlaceholders();
            };

            containerInputs.appendChild(wrapper);
        }

        // REORGANIZAR PLACEHOLDERS
        function reorganizarPlaceholders() {

            const inputs =
                containerInputs.querySelectorAll('.ingrediente-input');

            inputs.forEach((input, index) => {

                input.placeholder = `Ingrediente ${index + 1}`;
            });
        }

        // GERAR RECEITA
        async function gerarReceita(event) {

            event.preventDefault();

            const inputs =
                document.querySelectorAll('.ingrediente-input');

            const listaIngredientes =
                Array.from(inputs)
                    .map(i => i.value.trim())
                    .filter(valor => valor !== "");

            errorContainer.classList.add('hidden');

            resultadoContainer.classList.add('hidden');

            spinner.classList.remove('hidden');

            btnEnviar.disabled = true;

            btnEnviar.classList.add('opacity-75');

            try {

                const response = await fetch(API_URL, {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        ingredientes: listaIngredientes
                    })

                });

                const data = await response.json();

                if (data.status === "success") {

                    receitaAtual = data.dados_receita;

                    exibirReceita(receitaAtual);

                } else {

                    mostrarErro(
                        data.message ||
                        "Ocorreu um erro ao processar."
                    );
                }

            } catch (error) {

                mostrarErro(
                    "Não foi possível conectar à API."
                );

            } finally {

                spinner.classList.add('hidden');

                btnEnviar.disabled = false;

                btnEnviar.classList.remove('opacity-75');
            }
        }

        // EXIBIR RECEITA
        function exibirReceita(receita) {

            document.getElementById('rec-titulo').innerText =
                receita.nome_da_receita;

            document.getElementById('rec-tempo').innerText =
                receita.tempo_de_preparo;

            document.getElementById('rec-porcoes').innerText =
                receita.porcoes;

            // INGREDIENTES
            const ulIngredientes =
                document.getElementById('rec-ingredientes');

            ulIngredientes.innerHTML = "";

            receita.ingredientes.forEach(ing => {

                const li = document.createElement('li');

                li.className =
                    "bg-[#f3e7da] p-4 rounded-2xl border border-[#e4d4c5]";

                li.innerText = ing;

                ulIngredientes.appendChild(li);
            });

            // PREPARO
            const olPreparo =
                document.getElementById('rec-preparo');

            olPreparo.innerHTML = "";

            receita.modo_de_preparo.forEach(passo => {

                const li = document.createElement('li');

                li.className =
                    "bg-[#f8f2ea] p-4 rounded-2xl border border-[#ece2d5]";

                li.innerText = passo;

                olPreparo.appendChild(li);
            });

            resultadoContainer.classList.remove('hidden');

            resultadoContainer.scrollIntoView({
                behavior: 'smooth'
            });
        }

        // ERRO
        function mostrarErro(mensagem) {

            errorContainer.innerText = mensagem;

            errorContainer.classList.remove('hidden');
        }

        // REINICIAR
        function reiniciarFormulario() {

            containerInputs.innerHTML = `

                <input
                    type="text"
                    placeholder="Ingrediente 1"
                    required
                    class="ingrediente-input w-full bg-[#fffdf9] border-2 border-[#dbc8b8] p-4 rounded-2xl focus:outline-none focus:border-[#a2674c]"
                >

                <input
                    type="text"
                    placeholder="Ingrediente 2"
                    required
                    class="ingrediente-input w-full bg-[#fffdf9] border-2 border-[#dbc8b8] p-4 rounded-2xl focus:outline-none focus:border-[#a2674c]"
                >

                <input
                    type="text"
                    placeholder="Ingrediente 3"
                    required
                    class="ingrediente-input w-full bg-[#fffdf9] border-2 border-[#dbc8b8] p-4 rounded-2xl focus:outline-none focus:border-[#a2674c]"
                >

            `;

            resultadoContainer.classList.add('hidden');

            errorContainer.classList.add('hidden');
        }

        // FAVORITAR
        function salvarFavorita() {

            if (!receitaAtual) return;

            let favoritas =
                JSON.parse(localStorage.getItem('favoritas')) || [];

            favoritas.push(receitaAtual);

            localStorage.setItem(
                'favoritas',
                JSON.stringify(favoritas)
            );

            mostrarFavoritas();

            alert('Receita salva ❤️');
        }

        // MOSTRAR FAVORITAS
        function mostrarFavoritas() {

            const favoritas =
                JSON.parse(localStorage.getItem('favoritas')) || [];

            const lista =
                document.getElementById('lista-favoritas');

            const container =
                document.getElementById('favoritas-container');

            lista.innerHTML = "";

            if (favoritas.length === 0) return;

            container.classList.remove('hidden');

            favoritas.forEach(receita => {

                const div = document.createElement('div');

                div.className =
                    "bg-[#fffaf2] border-2 border-[#d8c2b0] rounded-2xl p-5";

                div.innerHTML = `
                    <h3 class="text-2xl font-bold text-[#8b5e46]">
                        ${receita.nome_da_receita}
                    </h3>

                    <p class="mt-2">
                        ⏱️ ${receita.tempo_de_preparo}
                    </p>

                    <p>
                        🍽️ ${receita.porcoes}
                    </p>
                `;

                lista.appendChild(div);
            });
        }

        // COMPARTILHAR
        async function compartilharReceita() {

            if (!receitaAtual) return;

            const texto = `
🍲 ${receitaAtual.nome_da_receita}

⏱️ ${receitaAtual.tempo_de_preparo}
🍽️ ${receitaAtual.porcoes}
            `;

            if (navigator.share) {

                navigator.share({

                    title: receitaAtual.nome_da_receita,
                    text: texto

                });

            } else {

                navigator.clipboard.writeText(texto);

                alert("Receita copiada!");
            }
        }

        // PDF
        function baixarPDF() {

            if (!receitaAtual) return;

            const { jsPDF } = window.jspdf;

            const doc = new jsPDF();

            let y = 20;

            doc.setFontSize(22);

            doc.text(receitaAtual.nome_da_receita, 20, y);

            y += 15;

            doc.setFontSize(12);

            doc.text(
                `Tempo: ${receitaAtual.tempo_de_preparo}`,
                20,
                y
            );

            y += 10;

            doc.text(
                `Porções: ${receitaAtual.porcoes}`,
                20,
                y
            );

            y += 20;

            doc.setFontSize(18);

            doc.text("Ingredientes", 20, y);

            y += 10;

            doc.setFontSize(12);

            receitaAtual.ingredientes.forEach(item => {

                doc.text(`• ${item}`, 20, y);

                y += 8;
            });

            y += 10;

            doc.setFontSize(18);

            doc.text("Modo de preparo", 20, y);

            y += 10;

            doc.setFontSize(12);

            receitaAtual.modo_de_preparo.forEach((passo, index) => {

                doc.text(
                    `${index + 1}. ${passo}`,
                    20,
                    y
                );

                y += 8;
            });

            doc.save("receita.pdf");
        }

        // CARREGAR FAVORITAS
        mostrarFavoritas();

    </script>

</body>

</html>
